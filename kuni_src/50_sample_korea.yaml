task: |
  次の設計どおりに、横長（16:9）の画像を1枚つくってください。
  日本のテレビのバラエティ番組で、司会者のとなりに出る「きょうの3つのテーマ」のボードふうの画像です。
  文字は、text に書いたものだけを、一字一句そのまま入れてください。
canvas:
  aspect_ratio: "16:9"
  mood: 明るく、にぎやかで、親しみやすい。文字が主役で、遠くからでも読める
  background: 明るい水色。黄緑色のやわらかい大きな丸いにじみを、左上と右下に2〜3個
  margin: 四辺に画面の約4%の余白
layout:
  left_area: 画面の左、横幅の約36%。上にタイトル、その下に司会の円
  right_area: 画面の右、横幅の約60%。金のパネル3枚
  bottom_band: 画面のいちばん下、高さ約7%の白い帯（左右いっぱい）
title:
  position: 左エリアの上部（画面の上から5%〜30%）
  line1:
    text: "みんなの知らない"
    style: 黒い太字、白の太いフチどり、2行目より小さい
  line2:
    text: "韓国の世界"
    style: 赤い太字（#E60012に近い赤）、白の太いフチどり、1行目より大きい
  font: 太い丸ゴシック体。2行を少し右上がりにして、はずむ感じにする
host:
  position: 左エリアの中央から下（画面の上から34%〜88%）
  frame: 正円。外側から、ピンクの太いリング、紫の細いリング、白の細いリングの順
  character: 丸い顔のオリジナルキャラクター（短い黒髪、大きな目、ほおが少し赤い）。目を丸くして、少しおどろいた表情。実在の人物に似せない
  speech_bubble:
    position: 円の右上に少し重ねる
    text: "韓国って「K-POPとキムチの国」でしょ？"
    style: 白い吹き出し、黒い太字
panels:
  position: 右エリア（画面の上から4%〜88%）。同じ大きさの横長パネルを縦に3段、間は均等
  frame: 金色の太い額縁（角に飾り）。内側はクリーム色
  inside: 左の約35%に場面イラストの枠（金の細い枠）、右の約65%に文字2行（中央ぞろえ）
  items:
    - panel: 1
      picture: 大きな港に貨物船とコンテナが並び、クレーンが荷物を積んでいる様子
      line1:
        text: "国内の市場が大きくないから"
        style: 黒い太字、中くらい
      line2:
        text: "輸出で世界へ！"
        style: 赤い太字、大きく
    - panel: 2
      picture: 造船所の大きな船と、電子部品の工場で働く人のイラスト
      line1:
        text: "船から半導体まで"
        style: 黒い太字、中くらい
      line2:
        text: "工業がどんどん進化"
        style: 赤い太字、大きく
    - panel: 3
      picture: ステージで踊る人々のシルエットと、世界地図に広がる矢印
      line1:
        text: "製品の次は文化も"
        style: 黒い太字、中くらい
      line2:
        text: "音楽もドラマも世界へ"
        style: 赤い太字、大きく
bottom_band:
  text: "使った資料：教科書「アジア州」韓国のページ（工業と貿易）"
  style: 濃い灰色の小さな文字、左寄せ
rules:
  - text に書いた文字以外は入れない（英語のダミー文字、透かし、ロゴ、「PNG」などを入れない）
  - 実在の人物、アイドル、有名人の顔や似顔絵を描かない
  - 実在のテレビ番組名、テレビ局や企業のロゴを描かない
  - 国旗は描かない
  - 再生ボタンや「PLAY」などの、動画プレーヤーの表示を入れない
  - 文字は大きく、くっきりと。文字の上に絵を重ねない
